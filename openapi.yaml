openapi: 3.1.0
info:
  title: API Orbitale
  version: 1.0.0
  summary: Billetterie d'événements
  description: |
    API REST de la plateforme Orbitale.
    Les erreurs suivent la RFC 9457 (application/problem+json).
  contact:
    name: Équipe API Orbitale
    email: api@orbitale.test
servers:
  - url: http://localhost:3000
    description: Développement local
tags:
  - name: Événements
    description: Catalogue des événements
  - name: Billets
    description: Billets émis pour les commandes payées
  - name: Commandes
    description: Achat de billets
  - name: Scans
    description: Validation des billets par les bornes
  - name: Utilisateurs
    description: Comptes des spectateurs et organisateurs

paths:
  /v1/events:
    get:
      tags: [Événements]
      operationId: listEvents
      summary: Lister les événements
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [draft, published, cancelled] }
      responses:
        '200':
          description: La liste des événements
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventList' }
              example:
                data:
                  - id: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                    title: Nuit électro
                    description: null
                    venue: Le Zénith, Paris
                    startsAt: '2027-03-19T20:00:00.000Z'
                    capacity: 6000
                    remaining: 5874
                    price: 3900
                    currency: EUR
                    status: published
                    createdAt: '2026-11-20T10:00:00.000Z'
                    updatedAt: '2026-11-20T10:00:00.000Z'
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Événements]
      operationId: createEvent
      summary: Créer un événement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventCreate' }
            example:
              title: Nuit électro
              venue: Le Zénith, Paris
              startsAt: '2027-03-19T20:00:00.000Z'
              capacity: 6000
              price: 3900
              currency: EUR
              status: draft
      responses:
        '201':
          description: L'événement créé
          headers:
            Location:
              description: URI de la ressource créée
              schema: { type: string, format: uri-reference }
              example: /v1/events/6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
              example:
                id: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                title: Nuit électro
                description: null
                venue: Le Zénith, Paris
                startsAt: '2027-03-19T20:00:00.000Z'
                capacity: 6000
                remaining: 6000
                price: 3900
                currency: EUR
                status: draft
                createdAt: '2026-11-20T10:00:00.000Z'
                updatedAt: '2026-11-20T10:00:00.000Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Événements]
      operationId: getEvent
      summary: Lire un événement
      responses:
        '200':
          description: L'événement demandé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
              example:
                id: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                title: Nuit électro
                description: null
                venue: Le Zénith, Paris
                startsAt: '2027-03-19T20:00:00.000Z'
                capacity: 6000
                remaining: 5874
                price: 3900
                currency: EUR
                status: published
                createdAt: '2026-11-20T10:00:00.000Z'
                updatedAt: '2026-11-20T10:00:00.000Z'
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Événements]
      operationId: updateEvent
      summary: Modifier un événement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventPatch' }
            example:
              venue: Accor Arena, Paris
      responses:
        '200':
          description: L'événement modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
              example:
                id: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                title: Nuit électro
                description: null
                venue: Accor Arena, Paris
                startsAt: '2027-03-19T20:00:00.000Z'
                capacity: 6000
                remaining: 5874
                price: 3900
                currency: EUR
                status: published
                createdAt: '2026-11-20T10:00:00.000Z'
                updatedAt: '2026-11-21T09:30:00.000Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Événements]
      operationId: deleteEvent
      summary: Supprimer un événement
      responses:
        '204':
          description: Événement supprimé
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }


  /v1/tickets/{ticketId}:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Billets]
      operationId: getTicket
      summary: Lire un billet
      responses:
        '200':
          description: Le billet demandé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
              example:
                id: 0b7e4d2a-91c3-4f6e-8a1d-3c5b7e9f2a14
                orderId: 9d2f6a1c-5b8e-4c3d-a7f0-1e2b3c4d5e6f
                eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                code: ORB-3FA9C21B7E04
                status: valid
                usedAt: null
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/orders:
    get:
      tags: [Commandes]
      operationId: listOrders
      summary: Lister les commandes
      parameters:
        - name: buyerEmail
          in: query
          required: false
          schema: { type: string, format: email }
      responses:
        '200':
          description: La liste des commandes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderList' }
              example:
                data:
                  - id: 9d2f6a1c-5b8e-4c3d-a7f0-1e2b3c4d5e6f
                    eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                    buyerEmail: lea.martin@example.com
                    quantity: 2
                    total: 7800
                    currency: EUR
                    status: paid
                    createdAt: '2026-11-20T14:05:00.000Z'
                    tickets:
                      - id: 0b7e4d2a-91c3-4f6e-8a1d-3c5b7e9f2a14
                        orderId: 9d2f6a1c-5b8e-4c3d-a7f0-1e2b3c4d5e6f
                        eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                        code: ORB-3FA9C21B7E04
                        status: valid
                        usedAt: null
                      - id: 5c1a8e3f-7d2b-4a9c-b6e1-8f0d2c4a6b13
                        orderId: 9d2f6a1c-5b8e-4c3d-a7f0-1e2b3c4d5e6f
                        eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                        code: ORB-8B21D04E6CA7
                        status: valid
                        usedAt: null
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Commandes]
      operationId: createOrder
      summary: Passer une commande
      description: Répond 409 si l'événement n'a plus assez de places.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
            example:
              eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
              quantity: 2
              buyerEmail: lea.martin@example.com
      responses:
        '201':
          description: La commande créée
          headers:
            Location:
              description: URI de la ressource créée
              schema: { type: string, format: uri-reference }
              example: /v1/orders/9d2f6a1c-5b8e-4c3d-a7f0-1e2b3c4d5e6f
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
              example:
                id: 9d2f6a1c-5b8e-4c3d-a7f0-1e2b3c4d5e6f
                eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                buyerEmail: lea.martin@example.com
                quantity: 2
                total: 7800
                currency: EUR
                status: paid
                createdAt: '2026-11-20T14:05:00.000Z'
                tickets:
                  - id: 0b7e4d2a-91c3-4f6e-8a1d-3c5b7e9f2a14
                    orderId: 9d2f6a1c-5b8e-4c3d-a7f0-1e2b3c4d5e6f
                    eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                    code: ORB-3FA9C21B7E04
                    status: valid
                    usedAt: null
                  - id: 5c1a8e3f-7d2b-4a9c-b6e1-8f0d2c4a6b13
                    orderId: 9d2f6a1c-5b8e-4c3d-a7f0-1e2b3c4d5e6f
                    eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                    code: ORB-8B21D04E6CA7
                    status: valid
                    usedAt: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Commandes]
      operationId: getOrder
      summary: Lire une commande
      responses:
        '200':
          description: La commande demandée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
              example:
                id: 9d2f6a1c-5b8e-4c3d-a7f0-1e2b3c4d5e6f
                eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                buyerEmail: lea.martin@example.com
                quantity: 2
                total: 7800
                currency: EUR
                status: paid
                createdAt: '2026-11-20T14:05:00.000Z'
                tickets:
                  - id: 0b7e4d2a-91c3-4f6e-8a1d-3c5b7e9f2a14
                    orderId: 9d2f6a1c-5b8e-4c3d-a7f0-1e2b3c4d5e6f
                    eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                    code: ORB-3FA9C21B7E04
                    status: valid
                    usedAt: null
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Commandes]
      operationId: cancelOrder
      summary: Annuler une commande
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderPatch' }
            example:
              status: cancelled
      responses:
        '200':
          description: La commande annulée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
              example:
                id: 9d2f6a1c-5b8e-4c3d-a7f0-1e2b3c4d5e6f
                eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                buyerEmail: lea.martin@example.com
                quantity: 2
                total: 7800
                currency: EUR
                status: cancelled
                createdAt: '2026-11-20T14:05:00.000Z'
                tickets:
                  - id: 0b7e4d2a-91c3-4f6e-8a1d-3c5b7e9f2a14
                    orderId: 9d2f6a1c-5b8e-4c3d-a7f0-1e2b3c4d5e6f
                    eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                    code: ORB-3FA9C21B7E04
                    status: cancelled
                    usedAt: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/orders/{orderId}/tickets:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Billets]
      operationId: listOrderTickets
      summary: Lister les billets d'une commande
      responses:
        '200':
          description: Les billets de la commande
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketList' }
              example:
                data:
                  - id: 0b7e4d2a-91c3-4f6e-8a1d-3c5b7e9f2a14
                    orderId: 9d2f6a1c-5b8e-4c3d-a7f0-1e2b3c4d5e6f
                    eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                    code: ORB-3FA9C21B7E04
                    status: valid
                    usedAt: null
                  - id: 5c1a8e3f-7d2b-4a9c-b6e1-8f0d2c4a6b13
                    orderId: 9d2f6a1c-5b8e-4c3d-a7f0-1e2b3c4d5e6f
                    eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                    code: ORB-8B21D04E6CA7
                    status: valid
                    usedAt: null
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/scans:
    post:
      tags: [Scans]
      operationId: createScan
      summary: Valider un billet à l'entrée
      description: Répond 409 si le billet a déjà été utilisé ou annulé.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanCreate' }
            example:
              ticketCode: ORB-3FA9C21B7E04
              gate: A2
      responses:
        '201':
          description: Le scan enregistré
          headers:
            Location:
              description: URI de la ressource créée
              schema: { type: string, format: uri-reference }
              example: /v1/scans/2e8c4a6f-1b3d-4f5a-9c7e-0d2b4f6a8c10
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scan' }
              example:
                id: 2e8c4a6f-1b3d-4f5a-9c7e-0d2b4f6a8c10
                ticketCode: ORB-3FA9C21B7E04
                gate: A2
                scannedAt: '2027-03-19T19:12:44.000Z'
                result: accepted
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/events/{eventId}/scans:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Scans]
      operationId: listEventScans
      summary: Lister les entrées d'un événement
      responses:
        '200':
          description: Les scans de l'événement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanList' }
              example:
                data:
                  - id: 2e8c4a6f-1b3d-4f5a-9c7e-0d2b4f6a8c10
                    ticketCode: ORB-3FA9C21B7E04
                    gate: A2
                    scannedAt: '2027-03-19T19:12:44.000Z'
                    result: accepted
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/users:
    post:
      tags: [Utilisateurs]
      operationId: createUser
      summary: Créer un compte
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
            example:
              email: lea.martin@example.com
              name: Léa Martin
              password: motdepasse-solide
      responses:
        '201':
          description: Le compte créé
          headers:
            Location:
              description: URI de la ressource créée
              schema: { type: string, format: uri-reference }
              example: /v1/users/7a3e5c9b-2d4f-4a6c-8e0b-1f3d5a7c9e21
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example:
                id: 7a3e5c9b-2d4f-4a6c-8e0b-1f3d5a7c9e21
                email: lea.martin@example.com
                name: Léa Martin
                role: spectator
                createdAt: '2026-11-20T09:00:00.000Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Utilisateurs]
      operationId: getUser
      summary: Lire un compte
      responses:
        '200':
          description: Le compte demandé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example:
                id: 7a3e5c9b-2d4f-4a6c-8e0b-1f3d5a7c9e21
                email: lea.martin@example.com
                name: Léa Martin
                role: spectator
                createdAt: '2026-11-20T09:00:00.000Z'
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }


    TicketId:
      name: ticketId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    NotFound:
      description: Ressource introuvable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.orbitale.test/problems/not-found
            title: Ressource introuvable
            status: 404
            detail: Événement introuvable
            instance: /v1/events/6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
    BadRequest:
      description: Requête mal formée
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.orbitale.test/problems/bad-request
            title: Requête mal formée
            status: 400
            detail: Le corps n'est pas du JSON valide
    Validation:
      description: Données invalides
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
          example:
            type: https://api.orbitale.test/problems/validation
            title: Requête invalide
            status: 422
            detail: Le corps ne respecte pas le contrat
            errors:
              - field: capacity
                message: Doit être >= 1
    Conflict:
      description: Conflit avec l'état de la ressource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.orbitale.test/problems/conflict
            title: Conflit
            status: 409
            detail: Des billets ont déjà été vendus pour cet événement

  schemas:
    Problem:
      type: object
      description: Erreur au format RFC 9457
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, example: 'https://api.orbitale.test/problems/not-found' }
        title: { type: string, example: Ressource introuvable }
        status: { type: integer, example: 404 }
        detail: { type: string, example: Événement introuvable }
        instance: { type: string, example: /v1/events/6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23 }

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }

    Event:
      type: object
      required: [id, title, venue, startsAt, capacity, remaining, price, currency, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        venue: { type: string, minLength: 2, maxLength: 120 }
        startsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
        remaining: { type: integer, readOnly: true, description: Places encore disponibles }
        price: { type: integer, minimum: 0, description: Prix en centimes (3900 = 39,00 €) }
        currency: { type: string, enum: [EUR] }
        status: { type: string, enum: [draft, published, cancelled] }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }

    EventList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Event' }

    EventCreate:
      type: object
      additionalProperties: false
      required: [title, venue, startsAt, capacity, price]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        venue: { type: string, minLength: 2, maxLength: 120 }
        startsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
        price: { type: integer, minimum: 0, description: Prix en centimes }
        currency: { type: string, enum: [EUR], default: EUR }
        status: { type: string, enum: [draft, published], default: draft }

    EventPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        venue: { type: string, minLength: 2, maxLength: 120 }
        startsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
        price: { type: integer, minimum: 0, description: Prix en centimes }
        currency: { type: string, enum: [EUR] }
        status: { type: string, enum: [draft, published, cancelled] }


    Ticket:
